# ============================================================
# Master Computer Academy – TEST profile (H2 in-memory)
# ============================================================
# H2 runs in PostgreSQL compatibility mode so that Hibernate's
# PostgreSQLDialect DDL is accepted without a real database.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# JWT – deterministic test secret (not a real production key)
app.jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci1qdW5pdC10ZXN0cy1vbmx5LTMyYnl0ZXM=
app.jwt.expiration-ms=3600000

app.cors.allowed-origins=http://localhost:5173

app.seed.admin.email=admin@test.local
app.seed.admin.password=Test@Admin123

logging.level.com.mastercomputeracademy=DEBUG
logging.level.org.springframework.security=WARN
