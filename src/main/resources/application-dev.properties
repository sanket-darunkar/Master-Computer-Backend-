# ============================================================
# Master Computer Academy – DEVELOPMENT profile
# Activated by: SPRING_PROFILES_ACTIVE=dev  (default)
#
# Override any value via environment variables before running.
# See .env.example for the full list of supported variables.
# ============================================================

# ---- Database -------------------------------------------
# Provide real values via env vars; the fallbacks below are for
# convenience on a fresh local setup only.
#
# Neon (cloud) example:
#   DB_URL=jdbc:postgresql://<host>.neon.tech/neondb?sslmode=require
#
# Local PostgreSQL example:
#   DB_URL=jdbc:postgresql://localhost:5432/mca_cert_dev
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mca_cert_dev}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# ---- JPA / Hibernate ------------------------------------
# 'update' automatically creates/alters tables during development.
# Never use 'update' or 'create' in production – use 'validate' + Flyway.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ---- Logging --------------------------------------------
logging.level.com.mastercomputeracademy=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
