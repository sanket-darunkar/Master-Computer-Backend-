# ============================================================
# Master Computer Academy – Certificate Verification System
# Base application configuration
#
# Active profile is driven by the SPRING_PROFILES_ACTIVE env var.
# Default: dev
#
# Cloud deployment note (Render / Railway / Heroku):
#   These platforms inject a PORT environment variable automatically.
#   The server.port line below reads PORT first, then SERVER_PORT,
#   then falls back to 8080 for local development.
# ============================================================

spring.application.name=master-computer-academy-certificate-verification

# Active profile – override via env var SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ============================================================
# Server
# PORT     – used by Render / Railway / Heroku (set automatically)
# SERVER_PORT – manual override (local / custom deployments)
# Falls back to 8080 for local development
# ============================================================
server.port=${PORT:${SERVER_PORT:8080}}
server.servlet.context-path=/

# ============================================================
# Jackson
# ============================================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Kolkata

# ============================================================
# Actuator / Health
# Only the health endpoint is exposed – nothing else.
# ============================================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ============================================================
# JWT
# JWT_SECRET must be a Base64-encoded 256-bit (32-byte) key.
# Generate with: openssl rand -base64 32
# There is NO default – the application will refuse to start
# if JWT_SECRET is not set.
# ============================================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ============================================================
# CORS
#
# FRONTEND_URL – comma-separated list of allowed origins.
# Production : https://mastercomputeracademy.org
# Development: http://localhost:5173
#
# Do NOT use * in production. Do NOT allow credentials with *.
# ============================================================
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}

# ============================================================
# Seed admin (dev profile only – NEVER runs in production)
# ADMIN_PASSWORD has no fallback – must be supplied explicitly.
# ============================================================
app.seed.admin.email=${ADMIN_EMAIL:admin@mastercomputer.local}
app.seed.admin.password=${ADMIN_PASSWORD}

# ============================================================
# Multipart file upload
# Max file size 2 MB; max total request 3 MB (data JSON + photo)
# ============================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# ============================================================
# OpenAPI / Swagger
# ============================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# API base URL shown in Swagger UI server list.
# Set to https://api.mastercomputeracademy.org in production env vars.
app.api.base-url=${API_BASE_URL:http://localhost:8080}
