# ============================================================
# Master Computer Academy – PRODUCTION profile
# Activated by: SPRING_PROFILES_ACTIVE=prod
#
# ALL values MUST come from environment variables.
# Never hardcode credentials, URLs, or secrets here.
# Never commit a .env file.
#
# Required environment variables for production:
#   DB_URL              – Neon JDBC URL, e.g.:
#                         jdbc:postgresql://<host>.neon.tech/neondb?sslmode=require
#   DB_USERNAME         – database user
#   DB_PASSWORD         – database password
#   JWT_SECRET          – Base64-encoded 256-bit key (openssl rand -base64 32)
#   FRONTEND_URL        – https://mastercomputeracademy.org
#   PORT                – set automatically by Render; do not override manually
#
# Optional:
#   JWT_EXPIRATION_MS   – token lifetime in ms (default: 86400000 = 24h)
#   SPRING_PROFILES_ACTIVE – must be "prod"
# ============================================================

# ---- Database -------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP – tuned for a typical cloud-hosted single-instance deployment.
# Neon free tier supports up to 10 concurrent connections; stay conservative.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# Validate connections before use – prevents stale connection errors
# after Neon's automatic connection suspension on free tier.
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.keepalive-time=60000

# ---- JPA / Hibernate ------------------------------------
# IMPORTANT: ddl-auto=update lets Hibernate add missing columns on startup.
# This was changed from 'validate' to fix missing photo columns
# (photo_data, photo_mime_type, student_photo_url) in the production schema.
# After the first successful deploy with these columns present,
# this can safely be changed back to 'validate'.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ---- Logging --------------------------------------------
logging.level.com.mastercomputeracademy=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.level.root=WARN

# ---- Swagger / OpenAPI ----------------------------------
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# ---- Tomcat / Web server --------------------------------
server.tomcat.connection-timeout=20000

# ---- Actuator -------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
