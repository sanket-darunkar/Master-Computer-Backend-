# ============================================================
# Master Computer Academy – PRODUCTION profile
# Activated by: SPRING_PROFILES_ACTIVE=prod
#
# ALL values MUST come from environment variables.
# Never hardcode credentials, URLs, or secrets here.
# Never commit a .env file.
#
# Required environment variables for production:
#   DB_URL              – full JDBC connection string (SSL enabled)
#   DB_USERNAME         – database user
#   DB_PASSWORD         – database password
#   JWT_SECRET          – Base64-encoded 256-bit key (openssl rand -base64 32)
#   FRONTEND_URL        – https://mastercomputeracademy.org
#   PORT                – set automatically by Render; do not override manually
#
# Optional:
#   JWT_EXPIRATION_MS   – token lifetime in ms (default: 86400000 = 24h)
#   SPRING_PROFILES_ACTIVE – must be "prod"
# ============================================================

# ---- Database -------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP – tuned for a typical cloud-hosted single-instance deployment.
# Adjust maximum-pool-size based on your database plan's max connections.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# Validate connections before giving them out – prevents stale connection errors
# after the database host briefly drops connections.
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.keepalive-time=60000

# ---- JPA / Hibernate ------------------------------------
# IMPORTANT: ddl-auto=validate means Hibernate will refuse to start if the
# database schema does not match the entities exactly.
# Before deploying a new version with schema changes, run the SQL manually
# or use Flyway migrations (see README § Production Considerations).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ---- Logging --------------------------------------------
# No DEBUG or TRACE in production – avoids leaking SQL, request details,
# or internal data into logs.
logging.level.com.mastercomputeracademy=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.level.root=WARN

# ---- Swagger / OpenAPI ----------------------------------
# Swagger UI and the OpenAPI JSON endpoint are DISABLED in production.
# The API is self-documented for the frontend team via the README.
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# ---- Tomcat / Web server --------------------------------
# Render terminates TLS at its edge proxy.
# The app runs plain HTTP internally; do not configure SSL here.
server.tomcat.connection-timeout=20000

# ---- Actuator -------------------------------------------
# Only the health endpoint is exposed. Used by Render's health check.
# Path: GET /actuator/health  (Spring Boot default) or GET /api/health (custom)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
